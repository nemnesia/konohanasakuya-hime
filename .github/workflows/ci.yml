name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']

    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Install dependencies
        run: scripts/ci/setup_lint.sh
      - name: Build resources
        run: scripts/ci/build.sh
      - name: Lint
        run: scripts/ci/lint.sh 'C0103,R6301,W0212,W0613,W0611,C0415,W0621,W0404,W0612,C1803,W0718,R0914,R1705,R0912,R0915'
      - name: Run tests
        run: scripts/ci/test.sh
      - name: Run packaging smoke test
        run: scripts/ci/package_smoke.sh
